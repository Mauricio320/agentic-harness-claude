# Valida el marketplace y los tres plugins contra la versión probada del CLI, que vive en
# plugins/arnes/compat.json: una sola fuente. La lee este CI, tests/compat.test.js exige que la matriz
# del README y docs/PROBADORES.md digan la misma, y SessionStart compara con ella la versión que corre
# la sesión. Para subirla se cambia ahí, y el test dice qué documento quedó atrás.
stages:
  - validate

.cli:
  image: node:24
  before_script:
    - CLAUDE_CODE_VERSION=$(node -p "require('./plugins/arnes/compat.json').claudeCode")
    - npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    - claude --version

validate:
  extends: .cli
  stage: validate
  script:
    - claude plugin validate --strict .
    - claude plugin validate --strict plugins/arnes
    - claude plugin validate --strict plugins/arnes-ui
    - claude plugin validate --strict plugins/arnes-mod

# Tests de los scripts del arnés sobre repos de juguete; no necesitan el CLI.
test:
  stage: validate
  image: node:24
  script:
    - node --test "plugins/arnes/tests/*.test.js"

# Tests de los mods con el motor de prueba del CLI fijado.
plugin-test:
  extends: .cli
  stage: validate
  script:
    - claude plugin test plugins/arnes-ui
    - claude plugin test plugins/arnes-mod
